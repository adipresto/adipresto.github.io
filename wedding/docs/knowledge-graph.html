  ['page-filter-preview','impl-film-filter'],
  ['film-roll','impl-film-filter'],
  ['page-filmroll-demo','impl-typography'],
  ['impl-typography','tech-fontface'],
  ['ec-filesize','impl-compress-script'],
  ['film-roll','impl-compress-script'],
  ['page-filmroll-demo','slide-tanggal'],
  ['slide-tanggal','impl-save-gcal'],
  ['page-filmroll-demo','impl-loading-screen'],
  ['impl-guest-gate','impl-loading-screen'],
  ['slide-resepsi','impl-lokasi-akad-svg'],
];

const nodeMap = {};
nodes.forEach(n => nodeMap[n.id] = n);

const adj = {};
edges.forEach(([a,b]) => {
  (adj[a] = adj[a] || new Set()).add(b);
  (adj[b] = adj[b] || new Set()).add(a);
});

const typeAngles = { root: 0, component: 0, edgecase: Math.PI/3, impl: Math.PI, tech: -Math.PI/2, page: Math.PI/2 };
nodes.forEach((n) => {
  const base = typeAngles[n.type] || 0;
  const jitter = (Math.random() - 0.5) * Math.PI * 2 * 0.6;
  const angle = base + jitter;
  const rad = n.type === 'root' ? 0 : n.type === 'component' ? 180 : 320 + Math.random() * 80;
  n.x = window.innerWidth / 2 + Math.cos(angle) * rad;
  n.y = window.innerHeight / 2 + Math.sin(angle) * rad;
  n.vx = 0; n.vy = 0;
});

nodeMap['root'].x = window.innerWidth / 2;
nodeMap['root'].y = window.innerHeight / 2;

let hoveredNode = null;
let dragNode = null, dragOX = 0, dragOY = 0;

function nodeColor(t) { return C[t] || '#fff'; }

function getNodeAt(x, y) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    const dx = x - n.x, dy = y - n.y;
    if (dx*dx + dy*dy <= (n.r + 5) * (n.r + 5)) return n;
  }
  return null;
}

const REPEL = 3200, SPRING = 0.035, REST = 130, DAMP = 0.82, CENTER = 0.0015;

function simulate() {
  const W = canvas.width, H = canvas.height;
  for (let i = 0; i < nodes.length; i++) {
    for (let j = i+1; j < nodes.length; j++) {
      const a = nodes[i], b = nodes[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d2 = Math.max(dx*dx + dy*dy, 1);
      const d = Math.sqrt(d2);
      const f = REPEL / d2;
      a.vx -= dx/d * f; a.vy -= dy/d * f;
      b.vx += dx/d * f; b.vy += dy/d * f;
    }
  }
  edges.forEach(([aid, bid]) => {
    const a = nodeMap[aid], b = nodeMap[bid];
    if (!a || !b) return;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    const f = (d - REST) * SPRING;
    a.vx += dx/d*f; a.vy += dy/d*f;
    b.vx -= dx/d*f; b.vy -= dy/d*f;
  });
  nodes.forEach(n => {
    n.vx += (W/2 - n.x) * CENTER;
    n.vy += (H/2 - n.y) * CENTER;
  });
  nodes.forEach(n => {
    if (n === dragNode) return;
    n.vx *= DAMP; n.vy *= DAMP;
    n.x += n.vx; n.y += n.vy;
    const pad = n.r + 12;
    n.x = Math.max(pad, Math.min(W - pad, n.x));
    n.y = Math.max(pad, Math.min(H - pad, n.y));
  });
}

function draw() {
  const W = canvas.width, H = canvas.height;
  ctx.clearRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(26,58,96,0.12)';
  for (let x = 0; x < W; x += 36) {
    for (let y = 0; y < H; y += 36) {
      ctx.beginPath(); ctx.arc(x, y, 0.8, 0, Math.PI*2); ctx.fill();
    }
  }

  const hiSet = hoveredNode ? new Set([hoveredNode.id, ...(adj[hoveredNode.id] || [])]) : null;

  edges.forEach(([aid, bid]) => {
    const a = nodeMap[aid], b = nodeMap[bid];
    if (!a || !b) return;
    const hi = hiSet && hiSet.has(aid) && hiSet.has(bid);
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.sqrt(dx*dx + dy*dy) || 1;
    ctx.beginPath();
    ctx.moveTo(a.x + dx/d * a.r, a.y + dy/d * a.r);
    ctx.lineTo(b.x - dx/d * b.r, b.y - dy/d * b.r);
    ctx.strokeStyle = hi ? 'rgba(232,160,48,0.55)' : 'rgba(70,120,180,0.14)';
    ctx.lineWidth = hi ? 1.5 : 0.8;
    ctx.stroke();
  });

  nodes.forEach(n => {
    const col = nodeColor(n.type);
    const isHi = hiSet ? hiSet.has(n.id) : false;
    const isHov = n === hoveredNode;
    const dim = hiSet && !isHi;

    if (isHov || isHi) {
      const g = ctx.createRadialGradient(n.x, n.y, n.r * 0.4, n.x, n.y, n.r * 3);
      g.addColorStop(0, col + '30');
      g.addColorStop(1, col + '00');
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r * 3, 0, Math.PI*2);
      ctx.fillStyle = g; ctx.fill();
    }

    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
    ctx.fillStyle = dim ? col + '22' : col + (isHov ? 'EE' : 'BB');
    ctx.fill();
    ctx.strokeStyle = dim ? col + '18' : col + (isHov ? 'FF' : 'CC');
    ctx.lineWidth = isHov ? 2 : 0.8;
    ctx.stroke();

    if (n.type === 'root') {
      ctx.beginPath(); ctx.arc(n.x, n.y, 5, 0, Math.PI*2);
      ctx.fillStyle = '#091525'; ctx.fill();
    }

    const fs = n.type === 'root' ? 12 : n.type === 'component' ? 10 : 8;
    ctx.font = `${n.type === 'root' ? 700 : 500} ${fs}px 'Courier New', monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    ctx.fillStyle = dim ? 'rgba(120,160,200,0.15)' : (isHov ? '#fff' : 'rgba(180,210,240,0.80)');

    const words = n.label.split(' ');
    const half = Math.ceil(words.length / 2);
    const line1 = words.slice(0, half).join(' ');
    const line2 = words.slice(half).join(' ');
    const yBase = n.y + n.r + 4;
    ctx.fillText(line1, n.x, yBase);
    if (line2) ctx.fillText(line2, n.x, yBase + fs + 1);
  });
}

function tick() { simulate(); draw(); requestAnimationFrame(tick); }
tick();

function pos(e) {
  const r = canvas.getBoundingClientRect();
  const t = e.touches ? e.touches[0] : e;
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}

canvas.addEventListener('mousemove', e => {
  const {x, y} = pos(e);
  if (dragNode) {
    dragNode.x = x + dragOX; dragNode.y = y + dragOY;
    dragNode.vx = 0; dragNode.vy = 0; return;
  }
  const n = getNodeAt(x, y);
  hoveredNode = n;
  canvas.style.cursor = n ? 'grab' : 'default';
  if (n) {
    tooltip.style.display = 'block';
    const tx = x + 18, ty = Math.max(10, y - 20);
    tooltip.style.left = Math.min(tx, window.innerWidth - 260) + 'px';
    tooltip.style.top = ty + 'px';
    const typeLabel = { root: 'Root', component: 'Komponen', edgecase: 'Edge Case', impl: 'Implementasi', tech: 'Teknologi', page: 'Halaman' }[n.type] || n.type;
    tooltip.innerHTML = `<strong style="color:${nodeColor(n.type)};font-family:'Courier New',monospace;font-size:11px;letter-spacing:0.04em">${n.label}</strong><br><span style="color:#3A6A9A;font-size:10px;text-transform:uppercase;letter-spacing:0.08em;font-family:'Courier New',monospace">${typeLabel}</span><br><span style="display:block;margin-top:5px;font-size:11px;color:#8AAAC8">${n.desc}</span>`;
  } else {
    tooltip.style.display = 'none';
  }
});

canvas.addEventListener('mousedown', e => {
  const {x, y} = pos(e);
  const n = getNodeAt(x, y);
  if (n) { dragNode = n; dragOX = n.x - x; dragOY = n.y - y; canvas.style.cursor = 'grabbing'; }
});
canvas.addEventListener('mouseup', () => { dragNode = null; canvas.style.cursor = hoveredNode ? 'grab' : 'default'; });
canvas.addEventListener('mouseleave', () => { hoveredNode = null; tooltip.style.display = 'none'; dragNode = null; });
</script>
</body>
