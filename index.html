<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="" />
  <title></title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --primary: #2563eb; --primary-dark: #1d4ed8;
      --text: #111827; --muted: #6b7280;
      --bg: #f3f4f6; --surface: #ffffff; --border: #e5e7eb;
      --radius-card: 14px; --radius-btn: 8px;
      --shadow-card: 0 2px 8px rgba(0,0,0,.06), 0 8px 32px rgba(0,0,0,.08);
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; line-height: 1.6; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 1.75rem 1.5rem; }
    .header-inner { max-width: 880px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; gap: 1.25rem; flex-wrap: wrap; }
    .header-identity h1 { font-size: 1.7rem; font-weight: 700; letter-spacing: -0.025em; color: var(--text); }
    .header-identity p { margin-top: 0.2rem; font-size: 0.95rem; font-weight: 400; color: var(--muted); }
    .header-actions { display: flex; gap: 0.65rem; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.5rem 1.1rem; border-radius: var(--radius-btn); font-family: inherit; font-size: 0.865rem; font-weight: 500; text-decoration: none; cursor: pointer; transition: background 0.15s, color 0.15s, box-shadow 0.15s, border-color 0.15s; white-space: nowrap; }
    .btn svg { width: 15px; height: 15px; flex-shrink: 0; }
    .btn-outline { background: transparent; color: var(--primary); border: 1.5px solid var(--primary); }
    .btn-outline:hover { background: #eff6ff; border-color: var(--primary-dark); color: var(--primary-dark); }
    .btn-primary { background: var(--primary); color: #fff; border: 1.5px solid transparent; }
    .btn-primary:hover { background: var(--primary-dark); box-shadow: 0 2px 10px rgba(37,99,235,.35); }
    main { max-width: 880px; margin: 2.25rem auto 0; padding: 0 1.5rem 4rem; }
    .doc-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 0.75rem; }
    .doc-card { background: var(--surface); border-radius: var(--radius-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); overflow: hidden; }
    .doc-card iframe { display: block; width: 100%; height: 88vh; min-height: 560px; border: none; }
    .iframe-fallback { padding: 2rem; text-align: center; color: var(--muted); font-size: 0.9rem; }
    .iframe-fallback a { color: var(--primary); text-decoration: underline; }
    footer { text-align: center; padding: 1.25rem 1rem 2rem; color: var(--muted); font-size: 0.78rem; }
    .mobile-cta { display: none; }
    @media (max-width: 768px) {
      .header-inner { flex-direction: column; align-items: flex-start; }
      .header-identity h1 { font-size: 1.35rem; }
      .doc-card { display: none; }
      .doc-label { display: none; }
      .mobile-cta {
        display: flex; flex-direction: column; align-items: center;
        gap: 1rem; padding: 3rem 1.5rem; text-align: center;
        background: var(--surface); border-radius: var(--radius-card);
        border: 1px solid var(--border); box-shadow: var(--shadow-card);
      }
      .mobile-cta p { font-size: 0.95rem; color: var(--muted); max-width: 280px; }
      .mobile-cta .btn { padding: 0.75rem 1.75rem; font-size: 0.95rem; }
    }
    @media print {
      @page { margin: 0; }
      header, footer, .doc-label { display: none !important; }
      body { background: white; }
      main { margin: 0; padding: 0; max-width: 100%; }
      .doc-card { box-shadow: none; border: none; border-radius: 0; }
      .doc-card iframe { height: 100vh; min-height: unset; }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-inner">
      <div class="header-identity">
        <h1 id="vm-name"></h1>
        <p id="vm-tagline"></p>
      </div>
      <div class="header-actions">
          <!--
        <a href="./ats.html" class="btn btn-outline" aria-label="Cek ATS CV">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          ATS Check
        </a>
          -->
        <a id="vm-linkedin" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-outline" aria-label="Buka profil LinkedIn">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19 0H5C2.239 0 0 2.239 0 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5V5c0-2.761-2.238-5-5-5zM8 19H5V8h3v11zM6.5 6.732c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zM20 19h-3v-5.604c0-3.368-4-3.113-4 0V19h-3V8h3v1.765c1.396-2.586 7-2.777 7 2.476V19z"/></svg>
          LinkedIn
        </a>
        <a id="vm-download" href="#" download class="btn btn-primary" aria-label="Download CV sebagai PDF">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download CV
        </a>
      </div>
    </div>
  </header>
  <main>
    <p class="doc-label">Curriculum Vitae</p>
    <div class="doc-card">
      <iframe id="vm-iframe" src="" title="CV / Resume" loading="lazy" allowfullscreen>
        <div class="iframe-fallback">
          <p>Browser Anda tidak mendukung tampilan iframe.</p>
          <p>Silakan <a id="vm-fallback" href="#" target="_blank" rel="noopener noreferrer">buka dokumen CV ini secara langsung</a>.</p>
        </div>
      </iframe>
    </div>
    <div class="mobile-cta">
      <p>Tampilan dokumen tidak optimal di layar kecil.</p>
      <a id="vm-mobile-view" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-primary">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        Lihat CV
      </a>
      <a id="vm-mobile-download" href="#" download class="btn btn-outline">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
        Download PDF
      </a>
    </div>
  </main>
  <footer>
    <p>&copy; <span id="year"></span> <span id="vm-footer-name"></span> &mdash; All rights reserved.</p>
  </footer>
  <script>
    /* ── VIEWMODEL — edit di sini ── */
    const CV = {
      firstName:          "MR. Adi",
      lastName:           "Prasetyo",
      prefix:             "",
      professionalJargon: ".NET Developer",
      linkedinUrl:        "https://www.linkedin.com/in/mr-adiprasetyo/",
      cvPublishedLink:    "https://docs.google.com/document/d/e/2PACX-1vRfjotP1VxyZUSpLExAOn2PLZblotWfRxokYf-bG4UwzeMaPeV7mfiZPtFWBwAIqKQF3VTEOSU5Hry_/pub",
    };
    /* ── RENDERER — jangan diubah ── */
    (function render() {
      const fullName  = [CV.prefix, CV.firstName, CV.lastName].filter(Boolean).join(" ");
      const shortName = [CV.firstName, CV.lastName].filter(Boolean).join(" ");
      document.title = fullName + " — CV / Resume";
      document.querySelector('meta[name="description"]').content = "CV dan Resume profesional " + shortName + ".";
      document.getElementById("vm-name").textContent        = fullName;
      document.getElementById("vm-tagline").textContent     = CV.professionalJargon;
      document.getElementById("vm-linkedin").href           = CV.linkedinUrl;
      const pdfPath = "./assets/pdf/Software Engineer - Muhammad Rizky Adi Prasetyo - CV - APR2026.pdf";
      document.getElementById("vm-download").href           = pdfPath;
      document.getElementById("vm-mobile-view").href        = pdfPath;
      document.getElementById("vm-mobile-download").href    = pdfPath;
      document.getElementById("vm-iframe").src              = CV.cvPublishedLink + "?embedded=true";
      document.getElementById("vm-fallback").href           = CV.cvPublishedLink;
      document.getElementById("vm-footer-name").textContent = shortName;
      document.getElementById("year").textContent           = new Date().getFullYear();
    })();
  </script>
</body>
</html>
